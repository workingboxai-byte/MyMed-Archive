<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MyMed Archive">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="6" />
  <!-- Clinical Medical Shield -->
  <path
    d="M256 76 L396 124 V246 C396 340 336 406 256 440 C176 406 116 340 116 246 V124 Z"
    fill="url(#shield)"
    fill-opacity="0.16"
    stroke="url(#shield)"
    stroke-width="18"
    stroke-linejoin="round"
  />
  <!-- Stylized Spine Vertebrae Column inside Shield -->
  <g fill="url(#spine)">
    <rect x="218" y="148" width="76" height="26" rx="13" />
    <rect x="206" y="190" width="100" height="28" rx="14" />
    <rect x="196" y="234" width="120" height="30" rx="15" />
    <rect x="206" y="280" width="100" height="28" rx="14" />
    <rect x="220" y="324" width="72" height="26" rx="13" />
    <circle cx="256" cy="376" r="14" fill="#38bdf8" />
  </g>
  <!-- Subtle central spinal canal accent -->
  <rect x="249" y="156" width="14" height="186" rx="7" fill="#0ea5e9" fill-opacity="0.45" />
</svg>
